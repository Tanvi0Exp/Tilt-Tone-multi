<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tilt and Tone</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000000; overscroll-behavior: none; }
      #board {
        position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>

    <script src="script.js"></script>
  </body>
</html>
